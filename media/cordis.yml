# DSH Agent for VS Code — child runtime composition.
# stdout is reserved for JSON-RPC frames; never add a console logger here.
# Environment-driven values are supplied by the extension (src/runtime.ts):
#   DSH_CWD           workspace folder (agent working directory)
#   DSH_SYSTEM_PROMPT persona
#   DSH_SESSION_ROOT  session-log persistence root
#   DSH_HOME          harness home (defaults to ~/.dsh) — credentials resolve here

- id: sdk-jsonrpc-server
  name: '@deepseek-ai/dsh-sdk-jsonrpc-server'
  config:
    maxTokensAsSuccess: !!js "process.env.DSH_MAX_TOKENS_AS_SUCCESS === undefined ? true : JSON.parse(process.env.DSH_MAX_TOKENS_AS_SUCCESS)"

# The DeepSeek adapter: full thinking at max effort; model arrives per session
# over JSON-RPC, so nothing is pinned here beyond the catalog the picker offers.
- id: llm-deepseek
  name: '@deepseek-ai/dsh-llm-deepseek'
  config:
    thinking: enabled
    reasoningEffort: max
    models:
      - id: deepseek-v4-flash
      - id: deepseek-v4-pro

# Credential seam: reuses $DSH_HOME/.credentials.yaml (DEEPSEEK_API_KEY stored
# by the DeepSeek Harness app), so no key copy/paste is needed.
- id: credentials
  name: '@deepseek-ai/dsh-credentials-local'

# Managed child-process groups for the bash executor.
- id: subprocess
  name: '@deepseek-ai/dsh-subprocess-local'

- id: bash
  name: '@deepseek-ai/dsh-bash-local'
  config:
    cwd: !!js process.env.DSH_CWD ?? process.cwd()
    timeoutMs: 60000

# Agent spine: loop, system prompt, tool registry, session store, titles.
# workspace-context loads AGENTS.md/CLAUDE.md from the workspace; skills load
# from DSH_HOME and the workspace .agents/skills, giving the agent the same
# skill set the desktop harness uses.
- id: agent-spine
  name: '@deepseek-ai/dsh-agent-spine-demo'
  config:
    persona: !!js process.env.DSH_SYSTEM_PROMPT ?? 'You are a coding agent.'
    workspaceContext:
      maxBytes: 65536
    skills:
      enabled: true
    toolBash:
      enableRunInBackground: false
    toolJobs: false

- id: sessions
  name: '@deepseek-ai/dsh-session-persistence-jsonl'
  config:
    root: !!js process.env.DSH_SESSION_ROOT ?? './.sessions'
    compression: !!js "process.env.DSH_SNAPSHOT === undefined ? 'zstd' : 'none'"

- id: session-checkpoints
  name: '@deepseek-ai/dsh-session-checkpoint-policy'

# Subagents: fresh-child spawn backend + model-facing tool.
- id: subagent
  name: '@deepseek-ai/dsh-subagent'

- id: subagent-spawn-in-process
  name: '@deepseek-ai/dsh-subagent-spawn-in-process'
  config:
    providerName: spawn

- id: tool-subagent
  name: '@deepseek-ai/dsh-tool-subagent'
  config:
    provider: spawn
    toolName: subagent
    enableRunInBackground: false
    maxDepth: 2

# todo_write whole-list snapshot for the panel task checklist.
- id: tool-todo
  name: '@deepseek-ai/dsh-tool-todo'
  config:
    allowParallelInProgress: true

# Filesystem stack: read / write / edit with read-before-edit observation.
- id: fs-local
  name: '@deepseek-ai/dsh-fs-local'
  config:
    cwd: !!js process.env.DSH_CWD ?? process.cwd()

- id: fs-observation-policy
  name: '@deepseek-ai/dsh-fs-observation-policy'

- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'

# Token metering and compaction keep long sessions within the model context.
- id: token-meter
  name: '@deepseek-ai/dsh-token-meter'

- id: compaction-basic
  name: '@deepseek-ai/dsh-compaction-basic'
  config:
    thresholdRatio: 0.8
    retainRatio: 0.16
    maxTokens: 8192
    compactionRetries: 1

# Web capability: seam + search/fetch providers + model-facing tools.
- id: web
  name: '@deepseek-ai/dsh-web'

- id: web-search
  name: '@deepseek-ai/dsh-web-search-deepseek'

- id: web-fetch
  name: '@deepseek-ai/dsh-web-fetch-http'

- id: tool-web
  name: '@deepseek-ai/dsh-tool-web'
